<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>InnoTrans – Pausenplaner Pro</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#090d16">

  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --border: #23304a;
      --text: #f1f5f9;
      --muted: #8493a8;
      --primary: #38bdf8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --conflict-zone: rgba(239, 68, 68, 0.4);
      --conflict-border: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background: var(--bg); color: var(--text); padding: 8px; padding-bottom: 90px; }
    
    .top-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    h1 { font-size: 1.05rem; color: var(--primary); }
    .action-buttons { display: flex; gap: 6px; }
    .btn-toggle { background: #22c55e; color: #000; font-weight: bold; border: none; padding: 7px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
    .btn-settings { background: #334155; color: #fff; border: 1px solid var(--border); padding: 7px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
    .btn-auto { background: var(--warning); color: #000; font-weight: bold; border: none; padding: 8px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; width: 100%; margin-bottom: 8px; }

    .legend-bar { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; font-size: 0.75rem; flex-wrap: wrap; align-items: center; }
    .badge-cov { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; font-weight: bold; color: #fff; font-size: 0.7rem; }

    /* ZEITLEISTE & GANTT */
    .chart-wrapper {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    .chart-inner { min-width: 720px; position: relative; }
    
    .timeline-head { height: 26px; display: flex; margin-left: 145px; border-bottom: 1px solid var(--border); position: relative; background: #0c1220; }
    .tick-label { position: absolute; transform: translateX(-50%); font-size: 0.65rem; color: var(--muted); font-weight: 600; top: 5px; }

    .zone-header-row {
      background: #172554;
      color: #93c5fd;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 5px 8px;
      border-bottom: 1px solid var(--border);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    .chart-row { display: flex; height: 34px; border-bottom: 1px solid #1a2338; position: relative; align-items: center; }
    .chart-row:nth-child(even) { background: rgba(255,255,255,0.015); }
    .col-name { width: 145px; min-width: 145px; font-size: 0.7rem; font-weight: 600; padding-left: 6px; border-right: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; flex-direction: column; justify-content: center; }
    .col-track { flex: 1; height: 100%; position: relative; }

    /* BALKEN MIT TOUCH DRAG-AND-DROP */
    .p-bar {
      position: absolute; top: 3px; height: 28px; border-radius: 5px; font-size: 0.65rem; font-weight: 700; color: #fff;
      display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.6); z-index: 2; overflow: hidden; white-space: nowrap;
      touch-action: none; cursor: grab;
    }
    .p-bar:active { cursor: grabbing; opacity: 0.85; transform: scale(1.02); z-index: 10; }
    .p-bar-conflict { background: #dc2626 !important; border: 2px solid #fff !important; animation: pulse 1s infinite alternate; }

    @keyframes pulse {
      from { box-shadow: 0 0 4px #ef4444; }
      to { box-shadow: 0 0 10px #f87171; }
    }

    /* EDIT CONTAINER */
    .edit-container { margin-top: 12px; }
    .person-card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; }
    .p-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 600; }
    select, input { background: #131b2e; border: 1px solid var(--border); color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 0.75rem; }
    button.btn-add { background: #38bdf8; color: #000; font-weight: bold; border: none; padding: 5px 8px; border-radius: 4px; font-size: 0.72rem; cursor: pointer; }

    /* MODAL */
    .modal-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 200; display: flex; justify-content: center; align-items: center; padding: 10px; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 14px; }
    .modal-title { font-size: 1.05rem; color: var(--primary); margin-bottom: 8px; font-weight: bold; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .entry-row { display: flex; gap: 4px; align-items: center; margin-bottom: 6px; background: #0c1220; padding: 5px; border-radius: 4px; }

    body.screenshot-mode .edit-container, body.screenshot-mode .btn-auto, body.screenshot-mode .btn-settings { display: none !important; }
    body.screenshot-mode .btn-toggle { background: #f59e0b; color: #000; }
    body.screenshot-mode { padding: 4px; }
  </style>
</head>

function persist() {
  try { localStorage.setItem("innotrans_app_v4", JSON.stringify(appData)); } catch(e){}
}

var loaded = null;
try { loaded = JSON.parse(localStorage.getItem("innotrans_app_v4")); } catch(e){}
if (loaded && loaded.covers && loaded.covers.length > 0) appData = loaded;

function toM(str) {
  if (!str) return 0;
  var p = str.split(":");
  return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
}

function toTimeStr(mins) {
  var h = String(Math.floor(mins / 60)).padStart(2, '0');
  var m = String(mins % 60).padStart(2, '0');
  return h + ":" + m;
}

function getAutoZoom() {
  var starts = [675]; // 11:15
  var ends = [930];   // 15:30
  appData.people.forEach(function(p) {
    if (p.p) {
      starts.push(toM(p.p.start));
      ends.push(toM(p.p.start) + p.p.dur);
    }
  });
  var minM = Math.min.apply(null, starts);
  var maxM = Math.max.apply(null, ends);
  var tStart = Math.max(450, Math.floor(minM / 30) * 30);
  var tEnd = Math.min(1080, Math.ceil(maxM / 30) * 30 + 30);
  return { start: tStart, end: tEnd, total: tEnd - tStart };
}

function renderTicks() {
  var range = getAutoZoom();
  var el = document.getElementById("head-ticks");
  el.innerHTML = "";
  for (var m = range.start; m <= range.end; m += 30) {
    var pct = ((m - range.start) / range.total) * 100;
    var d = document.createElement("div");
    d.className = "tick-label";
    d.style.left = pct + "%";
    d.innerText = toTimeStr(m);
    el.appendChild(d);
  }
}

function autoGenerateBreaks() {
  var BUFFER_MINS = 10;
  var busyUntil = {};
  appData.covers.forEach(function(c){ busyUntil[c.name] = toM(c.start); });

  var candidates = appData.people.filter(function(p){ return !p.zone.includes("Marshall-Haus"); });

  candidates.forEach(function(p) {
    var match = appData.covers.filter(function(c){ return c.zone === p.zone; });
    if (match.length === 0) match = appData.covers;

    match.sort(function(a, b){ return busyUntil[a.name] - busyUntil[b.name]; });
    var chosen = match[0];
    var bStart = busyUntil[chosen.name];
    var cEnd = toM(chosen.end);

    if (bStart + 45 <= cEnd) {
      p.p = { start: toTimeStr(bStart), dur: 45, coverName: chosen.name };
      busyUntil[chosen.name] = bStart + 45 + BUFFER_MINS;
    } else if (bStart + 30 <= cEnd) {
      p.p = { start: toTimeStr(bStart), dur: 30, coverName: chosen.name };
      busyUntil[chosen.name] = bStart + 30 + BUFFER_MINS;
    }
  });

  persist();
  render();
}

function clearOnlyBreaks() {
  appData.people.forEach(function(p){ p.p = null; });
  persist();
  render();
}

/* HAUPTRENDERER MIT ECHTER SPRINGER-KONFLIKTPRÜFUNG */
function updatePlan() {
  var range = getAutoZoom();
  var allBreaks = [];

  appData.people.forEach(function(p) {
    if (p.p) {
      var s = toM(p.p.start);
      allBreaks.push({
        pId: p.id,
        pName: p.name,
        desc: p.desc,
        zone: p.zone,
        start: s,
        dur: p.p.dur,
        end: s + p.p.dur,
        coverName: p.p.coverName || "Unbekannt"
      });
    }
  });

  // Springer-Doppelbelegungen exakt berechnen
  var conflicts = new Set();
  for (var i = 0; i < allBreaks.length; i++) {
    for (var j = i + 1; j < allBreaks.length; j++) {
      var b1 = allBreaks[i];
      var b2 = allBreaks[j];
      if (b1.coverName && b1.coverName !== "Selbstversorger" && b1.coverName === b2.coverName) {
        // Überschneidung prüfen: b1.start < b2.end && b2.start < b1.end
        if (b1.start < b2.end && b2.start < b1.end) {
          conflicts.add(b1.pId);
          conflicts.add(b2.pId);
        }
      }
    }
  }

  // Legende berechnen
  var coverMinutes = {};
  allBreaks.forEach(function(b){
    coverMinutes[b.coverName] = (coverMinutes[b.coverName] || 0) + b.dur;
  });

  var leg = document.getElementById("legend-container");
  leg.innerHTML = "<span style='font-size:0.7rem; color:var(--muted);'>Springer:</span>";
  appData.covers.forEach(function(c) {
    var m = coverMinutes[c.name] || 0;
    leg.innerHTML += "<span class='badge-cov' style='background:" + c.color + "'>" + c.name.split(" ")[0] + " (" + m + "m)</span>";
  });

  // Gantt nach Zonen rendern
  var gWrap = document.getElementById("gantt-rows");
  gWrap.innerHTML = "";

  appData.zones.forEach(function(zoneName) {
    var zonePeople = appData.people.filter(function(p){ return p.zone === zoneName; });
    if (zonePeople.length === 0) return;

    var zHead = document.createElement("div");
    zHead.className = "zone-header-row";
    zHead.innerHTML = "<span>📍 " + zoneName + "</span><span>" + zonePeople.length + " Stationen</span>";
    gWrap.appendChild(zHead);

    zonePeople.forEach(function(p) {
      var row = document.createElement("div");
      row.className = "chart-row";

      var nCol = document.createElement("div");
      nCol.className = "col-name";
      nCol.innerHTML = '<span>' + p.name + '</span><span style="font-size:0.62rem; color:var(--muted);">' + p.desc + '</span>';
      row.appendChild(nCol);

      var tCol = document.createElement("div");
      tCol.className = "col-track";

      var b = allBreaks.find(function(x){ return x.pId === p.id; });
      if (b) {
        var isConflict = conflicts.has(p.id);
        var covObj = appData.covers.find(function(c){ return c.name === b.coverName; });
        var barColor = isConflict ? "#dc2626" : (covObj ? covObj.color : "#64748b");

        var bar = document.createElement("div");
        bar.className = "p-bar " + (isConflict ? "p-bar-conflict" : "");
        bar.style.left = Math.max(0, ((b.start - range.start) / range.total) * 100) + "%";
        bar.style.width = ((b.dur / range.total) * 100) + "%";
        bar.style.background = barColor;
        bar.innerText = (isConflict ? "⚠️ " : "") + b.coverName.split(" ")[0] + " • " + toTimeStr(b.start);

        // DRAG & DROP INITIALISIEREN
        enableDrag(bar, p.id, range, tCol);

        // KLICK FÜR POPUP
        bar.addEventListener("click", function(ev) {
          if (!bar.dataset.dragged) {
            openBarModal(p.id);
          }
        });

        tCol.appendChild(bar);
      }

      row.appendChild(tCol);
      gWrap.appendChild(row);
    });
  });
}

/* FLÜSSIGES TOUCH & MOUSE DRAG AND DROP */
function enableDrag(el, personId, range, trackCol) {
  var startX = 0;
  var origLeftPct = 0;
  var isDragging = false;

  function onPointerDown(e) {
    isDragging = true;
    el.dataset.dragged = "";
    startX = e.clientX || (e.touches && e.touches[0].clientX);
    origLeftPct = parseFloat(el.style.left) || 0;
    
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
  }

  function onPointerMove(e) {
    if (!isDragging) return;
    el.dataset.dragged = "true";
    var curX = e.clientX || (e.touches && e.touches[0].clientX);
    var deltaPx = curX - startX;
    var trackWidth = trackCol.clientWidth;
    var deltaPct = (deltaPx / trackWidth) * 100;
    var newPct = Math.max(0, Math.min(100 - parseFloat(el.style.width), origLeftPct + deltaPct));
    el.style.left = newPct + "%";
  }

  function onPointerUp(e) {
    if (!isDragging) return;
    isDragging = false;
    window.removeEventListener("pointermove", onPointerMove);
    window.removeEventListener("pointerup", onPointerUp);

    if (el.dataset.dragged === "true") {
      // 15-Minuten Raster berechnen
      var finalPct = parseFloat(el.style.left);
      var calcMins = range.start + (finalPct / 100) * range.total;
      var snapMins = Math.round(calcMins / 15) * 15;
      
      var p = appData.people.find(function(x){ return x.id === personId; });
      if (p && p.p) {
        p.p.start = toTimeStr(snapMins);
        persist();
        render();
      }
    }
  }

  el.addEventListener("pointerdown", onPointerDown);
}

function renderEditForm() {
  var wrap = document.getElementById("people-list");
  wrap.innerHTML = "";

  appData.people.forEach(function(p) {
    var card = document.createElement("div");
    card.className = "person-card";

    var html = 
      '<div class="p-head">' +
        '<div><b>' + p.name + '</b> <small style="color:var(--muted);">(' + p.desc + ')</small></div>' +
        '<span style="font-size:0.68rem; background:#1e293b; color:#38bdf8; padding:2px 6px; border-radius:4px;">' + p.zone + '</span>' +
      '</div>';

    if (!p.p) {
      html += '<button class="btn-add" style="margin-top:5px;" onclick="createPause(' + p.id + ')">+ Pause eintragen</button>';
    } else {
      html += 
        '<div style="font-size:0.75rem; margin-top:5px; display:flex; justify-content:space-between; align-items:center;">' +
          '<span>Pause: <b>' + p.p.start + ' Uhr</b> (' + p.p.dur + 'm) • Springer: <b style="color:var(--primary);">' + (p.p.coverName || 'Keiner') + '</b></span>' +
          '<button class="btn-add" style="background:#334155; color:#fff;" onclick="openBarModal(' + p.id + ')">Ändern</button>' +
        '</div>';
    }

    card.innerHTML = html;
    wrap.appendChild(card);
  });
}

function createPause(pId) {
  var p = appData.people.find(function(x){ return x.id === pId; });
  if (!p) return;
  var defCover = appData.covers.find(function(c){ return c.zone === p.zone; }) || appData.covers[0];
  p.p = { start: "12:00", dur: 45, coverName: defCover ? defCover.name : "Hassan Ali Akram" };
  persist();
  render();
}

/* MODAL: SPRINGER TAUSCHEN BEI KLICK */
var activeModalPId = null;

function openBarModal(pId) {
  activeModalPId = pId;
  var p = appData.people.find(function(x){ return x.id === pId; });
  if (!p) return;

  document.getElementById("pop-title").innerText = p.name;
  document.getElementById("pop-sub").innerText = p.desc + " (" + p.zone + ")";

  var cSel = document.getElementById("pop-cover-sel");
  cSel.innerHTML = '<option value="">-- Name aus Liste wählen --</option>' + 
    appData.covers.map(function(c){
      var isS = (p.p && p.p.coverName === c.name) ? "selected" : "";
      return '<option value="' + c.name + '" ' + isS + '>' + c.name + '</option>';
    }).join('');

  document.getElementById("pop-cover-custom").value = (p.p && !appData.covers.some(function(c){ return c.name === p.p.coverName; })) ? p.p.coverName : "";
  document.getElementById("pop-dur").value = p.p ? p.p.dur : "45";

  document.getElementById("bar-modal").style.display = "flex";
}

function closeBarModal(e) {
  document.getElementById("bar-modal").style.display = "none";
}

function saveBarModal() {
  var p = appData.people.find(function(x){ return x.id === activeModalPId; });
  if (!p) return;

  var custom = document.getElementById("pop-cover-custom").value.trim();
  var sel = document.getElementById("pop-cover-sel").value;
  var finalName = custom || sel || "Freier Springer";

  if (!p.p) p.p = { start: "12:00", dur: 45, coverName: finalName };
  else {
    p.p.coverName = finalName;
    p.p.dur = parseInt(document.getElementById("pop-dur").value, 10);
  }

  persist();
  document.getElementById("bar-modal").style.display = "none";
  render();
}

function deleteBarModal() {
  var p = appData.people.find(function(x){ return x.id === activeModalPId; });
  if (p) { p.p = null; persist(); }
  document.getElementById("bar-modal").style.display = "none";
  render();
}

/* SETUP MODAL: ZONEN & TEAM BEARBEITEN */
function openSetupModal() {
  document.getElementById("setup-zones-input").value = appData.zones.join(", ");
  var box = document.getElementById("setup-people-list");
  box.innerHTML = "";

  appData.people.forEach(function(p, idx) {
    var row = document.createElement("div");
    row.className = "entry-row";
    row.innerHTML = 
      '<input type="text" value="' + p.name + '" style="flex:2;" id="st-name-' + idx + '">' +
      '<input type="text" value="' + p.desc + '" style="flex:2;" id="st-desc-' + idx + '">' +
      '<select style="flex:2;" id="st-zone-' + idx + '">' +
        appData.zones.map(function(z){ return '<option value="' + z + '" ' + (p.zone === z ? 'selected' : '') + '>' + z + '</option>'; }).join('') +
      '</select>';
    box.appendChild(row);
  });

  document.getElementById("setup-modal").style.display = "flex";
}

function closeSetupModal() {
  document.getElementById("setup-modal").style.display = "none";
}

function saveSetupModal() {
  var rawZones = document.getElementById("setup-zones-input").value;
  appData.zones = rawZones.split(",").map(function(s){ return s.trim(); }).filter(Boolean);

  appData.people.forEach(function(p, idx) {
    var nEl = document.getElementById("st-name-" + idx);
    var dEl = document.getElementById("st-desc-" + idx);
    var zEl = document.getElementById("st-zone-" + idx);
    if (nEl) p.name = nEl.value.trim();
    if (dEl) p.desc = dEl.value.trim();
    if (zEl) p.zone = zEl.value;
  });

  persist();
  closeSetupModal();
  render();
}

function toggleScreenshotMode() {
  document.body.classList.toggle("screenshot-mode");
  var btn = document.getElementById("mode-btn");
  if (document.body.classList.contains("screenshot-mode")) {
    btn.innerText = "✏️ Bearbeiten";
  } else {
    btn.innerText = "📸 Screenshot";
  }
}

function render() {
  renderTicks();
  updatePlan();
  renderEditForm();
}

render();
</script>
</body>
</html>
